name: Deploy to Azure VM

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AZURE_VM_HOST }}
        username: ${{ secrets.AZURE_VM_USERNAME }}
        key: ${{ secrets.AZURE_VM_SSH_KEY }}
        script: |
          # Stop and remove the existing container if it is running
          docker stop express-containerized || true
          docker rm express-containerized || true
          
          # Pull the latest public image from Docker Hub
          docker pull zeelz/express-containerized:${{ vars.IMAGE_TAG }}
          
          # Run the updated container
          docker run -d -p 3000:3000 --name express-containerized --platform linux/amd64 -e "DB_USER=${{ vars.DB_USER }}" -e "DB_HOST=${{ vars.DB_HOST }}" -e "DB_NAME=postgres" -e "DB_PORT=${{ vars.DB_PORT }}" zeelz/express-containerized:${{ vars.IMAGE_TAG }}